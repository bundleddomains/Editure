<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editure Lab v2</title>

<link rel="stylesheet" href="style.css">

<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
.thick-row {
  position: relative;
  display: flex;
  gap: 8px;
  align-items: center;
}

.thick-row input {
  flex: 1;
}

.thick-label {
  position: absolute;
  left: 8px;
  top: -14px;
  font-size: 12px;
  opacity: 0.7;
}


.panel.horizontal {
  width: 700px;
  height: 350px;
}
</style>

<script>
if (!window.location.search.includes("r=")) {
  window.location.replace(window.location.pathname + "?r=" + Date.now());
}
</script>

</head>

<body>

<div id="bar">

  <div class="row">
    <label style="width:100%">Scale
      <input id="previewScale" type="range" min="25" max="200" value="100">
    </label>
  </div>

  <div class="row">
    <button id="paste">Paste</button>
    <button id="run">Run</button>
    <button id="clear">Clear</button>
    <button id="stop">Stop</button>
    <button id="toggleCode">Code</button>
    <button id="bg">BG</button>
    <button id="toggleLayout">Horizontal</button>
    <button id="saveArt">Save</button>
    <button id="fxBtn">FX</button>
  </div>

  <div id="codeOptions" aria-hidden="true">
    <section class="code-runner" role="dialog" aria-modal="true" aria-label="HTML CSS JavaScript runner">
      <div class="code-runner-bar">
        <strong>CODE</strong>
        <span>Paste three separate files and run them together.</span>
        <button id="codeRunnerClose" type="button">Close</button>
        <button id="codeRunnerRun" type="button">Run</button>
      </div>

      <div class="code-runner-workspace">
        <div class="code-runner-editors">
          <label class="code-runner-editor">
            <span>HTML</span>
            <textarea id="htmlCode" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Paste HTML here"></textarea>
          </label>

          <label class="code-runner-editor">
            <span>CSS</span>
            <textarea id="cssCode" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Paste CSS here"></textarea>
          </label>

          <label class="code-runner-editor">
            <span>JS</span>
            <textarea id="jsCode" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Paste JavaScript here"></textarea>
          </label>
        </div>

        <div class="code-runner-preview">
          <span>PREVIEW</span>
          <iframe id="codeRunnerPreview" title="Rendered result" sandbox="allow-scripts allow-forms allow-modals allow-pointer-lock"></iframe>
        </div>
      </div>
    </section>
  </div>

  <div class="row" id="layers"></div>

  <div class="row">
    <label>X <input type="range" id="rotX" min="-60" max="60" value="0"></label>
    <label>Y <input type="range" id="rotY" min="-180" max="180" value="0"></label>
  </div>

  <div class="row">
    <label style="width:100%">Camera Orbit
      <input type="range" id="orbit" min="-180" max="180" value="0">
    </label>
  </div>

  <div class="row thick-row">
    <span class="thick-label">Thick</span>
    <input type="range" id="thick" min="-500" max="500" value="0">
    <input type="range" id="thick2" min="-500" max="500" value="0">
  </div>

</div>

<textarea id="code" placeholder="paste code here" style="display:none;"></textarea>

<div id="wrap">
  <div class="scene">
    <div class="viewer" id="viewer">

      <div class="preview-size-controls">
        <input id="artH" class="size-slider vertical" type="range" min="0" max="700" value="0">
        <input id="artW" class="size-slider horizontal" type="range" min="0" max="700" value="0">

        <input id="artY" class="move-slider move-vertical" type="range" min="-350" max="350" value="0">
        <input id="artX" class="move-slider move-horizontal" type="range" min="-350" max="350" value="0">
      </div>

      <div class="panel" id="panel">
        <iframe
          id="pv"
          sandbox="allow-scripts allow-same-origin"
          scrolling="no">
        </iframe>
      </div>

    </div>
  </div>
</div>

<script src="renderer.js"></script>
<script src="app.js"></script>

</body>
</html>
